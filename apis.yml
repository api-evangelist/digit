name: Digit
description: 'Digit was a consumer fintech company that built an automated personal-savings
  app: it analyzed a user''s checking-account activity and quietly moved small, safe amounts
  into an FDIC-insured savings account, later expanding into automated investing and
  retirement (Digit Invest, Digit Retirement). Founded in 2013 in San Francisco by Ethan
  Bloch and backed by GV (Google Ventures) among others, Digit was acquired by Oportun in
  late 2021 and folded into Oportun''s savings product. The standalone Digit brand is now
  retired: digit.co and hellodigit.com redirect to oportun.com/savings, and there is no
  public developer portal, documentation, or API. This profile is retained as a portfolio
  lead with no active developer surface.'
